spring.application.name=sisfer

# 1. Ajuste en URL: agregamos 'allowPublicKeyRetrieval=true' para evitar fallos de autenticación con root en MySQL 8+
spring.datasource.url=jdbc:mysql://localhost:3306/sisfer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. DIALECTO EXPLÍCITO (Solución direct al error de Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# Plantillas y Mensajes
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.main.allow-circular-references=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=true

#CONFIGURACION DE CORREO PARA CODIGO DE RECUPERACION
